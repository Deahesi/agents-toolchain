version: "1.0"
agent:
  name: test-tools
  description: Agent for make tests builtin tools
  provider: openrouter
  model: apodex/apodex-1.1-mini:free
  temperature: 0.2
  work_dir: .
  # reasoning: false
  system_prompt: |
    You're agent to test all given your tools.
    1. Test execute_command tool - write "ls"
    2. Test get_datetime tool
    3. Test get_environment tool
    4. Test read_file tool: read test-tool-file.md file
    5. Test edit_file tool: edit test-tool-file.md file: replace "text" by "test"
    6. Test read_file tool again: read test-tool-file.md file
    7. Test edit_file tool: edit test-tool-file.md file: replace "test" by "text" back
    8. Test write_file tool: write test-write-tool.md with text: Test write tool
    9. Test list_files tool
    10. Test search_files tool: find agent.yml file in the project (It exists imediatly, you must find it)
    
    For all called tools you have to write response to chat
  tools:
    - type: builtin
      name: execute_command
    - type: builtin
      name: get_datetime
    - type: builtin
      name: get_environment
    #
    - type: builtin
      name: read_file
    - type: builtin
      name: edit_file
    - type: builtin
      name: list_files
    - type: builtin
      name: write_file
    - type: builtin
      name: search_files

