name: Packages and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Tests and config validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable vX.Y.Z tag, got: $RELEASE_TAG"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check --config build/goreleaser.yaml

      - name: Go tests
        run: go test ./...

      - name: Node tests
        run: node --test build/tests/launcher.test.mjs build/tests/npm.test.mjs

      - name: Python tests
        run: python -m unittest discover -s build/tests -p 'test_*.py'

  release:
    name: Build and publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    concurrency:
      group: publish-release
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Build and publish all packages
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --config build/goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Validate generated artifacts
        run: python build/tests/check_artifacts.py

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            dist/metadata.json
            dist/artifacts.json
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/wheels/*.whl
            dist/homebrew/Casks/*.rb
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Package smoke (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist

      - name: npm installation smoke
        run: node build/tests/npm-smoke.mjs

      - name: Python installation smoke
        run: python build/tests/python_smoke.py

      - name: Configure Git identity for Homebrew
        if: runner.os == 'macOS'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        if: runner.os == 'macOS'

      - name: Homebrew installation smoke
        if: runner.os == 'macOS'
        run: python build/tests/homebrew_smoke.py

      - name: Check Linux packages and install Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python build/tests/check_linux.py
          sudo dpkg -i dist/*_amd64.deb
          atc --help
          atc --version
          mkdir -p .tmp/deb-smoke
          cd .tmp/deb-smoke
          atc init
          test -f agents-toolchain.yml

      - name: RPM installation smoke
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:43 bash -ceu '
            rpm -i /packages/*.x86_64.rpm
            atc --help
            atc --version
            mkdir -p /tmp/atc-smoke
            cd /tmp/atc-smoke
            atc init
            test -f agents-toolchain.yml
          '